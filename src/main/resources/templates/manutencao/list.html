<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Manutenções | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('manutencoes')}"></header>

      <main class="page-container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Controle de oficina</p>
            <h1>Manutenções</h1>
            <p class="page-subtitle">
              <span th:text="${totalManutencoes}">0</span>
              registros de manutenção na frota.
            </p>
          </div>
          <a class="button button-primary"
             th:if="${usuarioLogado.podeGerenciarManutencoes()}"
             th:href="@{/manutencoes/novo}">+ Nova manutenção</a>
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <section class="content-section">
          <form class="filters" method="get" th:action="@{/manutencoes}">
            <label for="veiculoId">Filtrar por veículo</label>
            <select id="veiculoId" name="veiculoId">
              <option value="">Todos os veículos</option>
              <option th:each="v : ${veiculos}"
                      th:value="${v.id}"
                      th:selected="${filtroVeiculoId != null and filtroVeiculoId == v.id}"
                      th:text="${v.placa + ' · ' + v.modelo}">
              </option>
            </select>
            <button class="button button-secondary" type="submit">Filtrar</button>
            <a class="link-button" th:href="@{/manutencoes}">Limpar filtro</a>
          </form>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Veículo</th>
                  <th>Quilometragem</th>
                  <th>Serviço realizado</th>
                  <th>Responsável / Oficina</th>
                  <th>Observação</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(manutencoes)}">
                  <td colspan="7" class="empty-state">
                    Nenhuma manutenção encontrada.
                  </td>
                </tr>
                <tr th:each="m : ${manutencoes}">
                  <td th:text="${#temporals.format(m.data, 'dd/MM/yyyy')}"></td>
                  <td>
                    <a th:if="${m.veiculo != null}"
                       th:href="@{/veiculos/detalhes/{id}(id=${m.veiculo.id})}"
                       th:text="${m.veiculo.placa + ' · ' + m.veiculo.modelo}"></a>
                  </td>
                  <td th:text="${#numbers.formatDecimal(m.quilometragem, 1, 0, 'POINT')} + ' km'"></td>
                  <td th:text="${m.servicoRealizado}"></td>
                  <td th:text="${m.responsavel}"></td>
                  <td th:text="${!#strings.isEmpty(m.observacao) ? m.observacao : '-'}"></td>
                  <td class="cell-actions">
                    <div class="table-actions">
                      <a th:if="${m.veiculo != null and usuarioLogado.podeEditarVeiculo(m.veiculo.motorista != null ? m.veiculo.motorista.id : null)}"
                         th:href="@{/manutencoes/editar/{id}(id=${m.id})}">Editar</a>
                      <form th:if="${usuarioLogado.admin or (m.veiculo != null and usuarioLogado.podeEditarVeiculo(m.veiculo.motorista != null ? m.veiculo.motorista.id : null))}"
                            th:action="@{/manutencoes/excluir/{id}(id=${m.id})}"
                            method="post"
                            onsubmit="return confirm('Tem certeza que deseja excluir esta manutenção?');">
                        <button type="submit" class="btn-action-delete">Excluir</button>
                      </form>
                      <span class="text-muted"
                            th:if="${!usuarioLogado.admin and !(m.veiculo != null and usuarioLogado.podeEditarVeiculo(m.veiculo.motorista != null ? m.veiculo.motorista.id : null))}">Somente leitura</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
