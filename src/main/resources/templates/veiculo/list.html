<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Veículos | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('veiculos')}"></header>

      <main class="page-container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Cadastro e operação</p>
            <h1>Veículos</h1>
            <p class="page-subtitle">
              <span th:text="${totalVeiculos}">0</span>
              veículos cadastrados na sua operação.
            </p>
          </div>
          <a
            class="button button-primary"
            th:if="${usuarioLogado.admin}"
            th:href="@{/veiculos/novo}"
            >+ Novo veículo</a
          >
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <section class="content-section">
          <form class="filters" method="get" th:action="@{/veiculos}">
            <label for="search">Buscar por placa, modelo ou motorista</label>
            <input
              id="search"
              name="q"
              type="search"
              placeholder="Ex.: ABC1D23"
              th:value="${filtroQ}"
            />
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="" th:selected="${#strings.isEmpty(filtroStatus)}">
                Todos os status
              </option>
              <option
                value="Disponível"
                th:selected="${filtroStatus == 'Disponível'}"
              >
                Disponível
              </option>
              <option
                value="Em trânsito"
                th:selected="${filtroStatus == 'Em trânsito'}"
              >
                Em trânsito
              </option>
              <option
                value="Em manutenção"
                th:selected="${filtroStatus == 'Em manutenção'}"
              >
                Em manutenção
              </option>
              <option
                value="Indisponível"
                th:selected="${filtroStatus == 'Indisponível'}"
              >
                Indisponível
              </option>
            </select>
            <button class="button button-secondary" type="submit">
              Filtrar
            </button>
            <a class="link-button" th:href="@{/veiculos}">Limpar filtros</a>
          </form>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Placa</th>
                  <th>Modelo</th>
                  <th>Motorista</th>
                  <th>Tags</th>
                  <th>Ano</th>
                  <th>Quilometragem</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(veiculos)}">
                  <td colspan="8" class="empty-state">
                    Nenhum veículo encontrado com os filtros atuais.
                  </td>
                </tr>
                <tr th:each="veiculo : ${veiculos}">
                  <td>
                    <strong class="plate" th:text="${veiculo.placa}"></strong>
                  </td>
                  <td th:text="${veiculo.modelo}"></td>
                  <td th:text="${veiculo.motorista != null ? veiculo.motorista.nome : '-'}"></td>
                  <td>
                    <span th:if="${#lists.isEmpty(veiculo.tags)}" class="text-muted">-</span>
                    <div class="tags-list" th:if="${!#lists.isEmpty(veiculo.tags)}">
                      <span class="tag-badge" th:each="tag : ${veiculo.tags}" th:text="${tag.nome}"></span>
                    </div>
                  </td>
                  <td th:text="${veiculo.ano}"></td>
                  <td
                    th:text="${#numbers.formatDecimal(veiculo.quilometragem, 1, 0, 'POINT')} + ' km'"
                  ></td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="${veiculo.status == 'Disponível' ? 'status-success' :
                                     (veiculo.status == 'Em trânsito' ? 'status-info' :
                                     (veiculo.status == 'Em manutenção' ? 'status-warning' : 'status-danger'))}"
                      th:text="${veiculo.status}"
                    ></span>
                  </td>
                  <td class="cell-actions">
                    <div class="table-actions">
                      <a
                        th:href="@{/veiculos/detalhes/{id}(id=${veiculo.id})}"
                        >Detalhes</a
                      >
                      <a
                        th:if="${usuarioLogado.podeEditarVeiculo(veiculo.motorista != null ? veiculo.motorista.id : null)}"
                        th:href="@{/veiculos/editar/{id}(id=${veiculo.id})}"
                        >Editar</a
                      >
                      <form
                        th:if="${usuarioLogado.admin}"
                        th:action="@{/veiculos/excluir/{id}(id=${veiculo.id})}"
                        method="post"
                        onsubmit="return confirm('Tem certeza que deseja remover este veículo da frota?');"
                      >
                        <button type="submit" class="btn-action-delete">
                          Excluir
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
