<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Motoristas | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('motoristas')}"></header>

      <main class="page-container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Equipe operacional</p>
            <h1>Motoristas</h1>
            <p class="page-subtitle">
              <span th:text="${totalMotoristas}">0</span>
              motoristas cadastrados e vinculados a usuários do sistema.
            </p>
          </div>
          <a class="button button-primary"
             th:if="${usuarioLogado.admin}"
             th:href="@{/motoristas/novo}">+ Novo motorista</a>
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <section class="content-section">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Usuário Vinculado</th>
                  <th>CPF</th>
                  <th>CNH</th>
                  <th>Categoria</th>
                  <th>Validade CNH</th>
                  <th>Telefone</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(motoristas)}">
                  <td colspan="9" class="empty-state">
                    Nenhum motorista cadastrado.
                  </td>
                </tr>
                <tr th:each="motorista : ${motoristas}">
                  <td><strong th:text="${motorista.nome}"></strong></td>
                  <td>
                    <span class="tag-badge"
                          th:if="${motorista.usuario != null}"
                          th:text="${'@' + motorista.usuario.username}"></span>
                  </td>
                  <td th:text="${motorista.cpf}"></td>
                  <td th:text="${motorista.numeroCnh}"></td>
                  <td th:text="${motorista.categoriaCnh}"></td>
                  <td th:text="${motorista.validadeCnh != null ? #temporals.format(motorista.validadeCnh, 'dd/MM/yyyy') : '-'}"></td>
                  <td th:text="${!#strings.isEmpty(motorista.telefone) ? motorista.telefone : '-'}"></td>
                  <td>
                    <span class="status-badge"
                          th:classappend="${motorista.status == 'Ativo' ? 'status-success' : 'status-warning'}"
                          th:text="${motorista.status}"></span>
                  </td>
                  <td class="cell-actions">
                    <div class="table-actions">
                      <a th:if="${usuarioLogado.podeEditarMotorista(motorista.id)}"
                         th:href="@{/motoristas/editar/{id}(id=${motorista.id})}">Editar</a>
                      <form th:if="${usuarioLogado.admin}"
                            th:action="@{/motoristas/excluir/{id}(id=${motorista.id})}"
                            method="post"
                            onsubmit="return confirm('Tem certeza que deseja excluir este motorista?');">
                        <button type="submit" class="btn-action-delete">Excluir</button>
                      </form>
                      <span class="text-muted"
                            th:if="${!usuarioLogado.podeEditarMotorista(motorista.id) and !usuarioLogado.admin}">Somente leitura</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
