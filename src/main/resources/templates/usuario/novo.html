<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Novo usuário | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('usuarios')}"></header>

      <main class="page-container">
        <nav th:replace="~{fragments/layout :: breadcrumbs('Usuários', @{/usuarios}, 'Novo')}"></nav>

        <div class="page-header">
          <div>
            <p class="eyebrow">Controle de acesso</p>
            <h1>Cadastrar Novo Usuário</h1>
            <p class="page-subtitle">Defina as credenciais e o perfil de permissão (ADMIN, OPERADOR ou MOTORISTA).</p>
          </div>
        </div>

        <form class="form-card" method="post" th:action="@{/usuarios/novo}" th:object="${usuario}" novalidate>
          <div class="form-section">
            <div class="form-section-heading">
              <h2>Dados de acesso</h2>
              <p>Credenciais e perfil do usuário.</p>
            </div>
            <div class="form-grid">
              <div class="form-group col-span-6">
                <label for="nome">Nome completo <span class="required-mark">*</span></label>
                <input id="nome" type="text" placeholder="Ex.: Marcos Oliveira" th:field="*{nome}" th:errorclass="campo-erro">
                <p class="mensagem-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
              </div>
              <div class="form-group col-span-6">
                <label for="username">Username (Login) <span class="required-mark">*</span></label>
                <input id="username" type="text" placeholder="Ex.: marcos.oliveira" th:field="*{username}" th:errorclass="campo-erro">
                <p class="mensagem-erro" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
              </div>
              <div class="form-group col-span-5">
                <label for="email">E-mail <span class="required-mark">*</span></label>
                <input id="email" type="email" placeholder="Ex.: marcos.oliveira@fleetops.com" th:field="*{email}" th:errorclass="campo-erro">
                <p class="mensagem-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
              </div>
              <div class="form-group col-span-3">
                <label for="senha">Senha <span class="required-mark">*</span></label>
                <input id="senha" type="password" placeholder="Mínimo de 4 caracteres" th:field="*{senha}" th:errorclass="campo-erro">
                <p class="mensagem-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
              </div>
              <div class="form-group col-span-4">
                <label for="perfil">Perfil de acesso <span class="required-mark">*</span></label>
                <select id="perfil" th:field="*{perfil}" th:errorclass="campo-erro">
                  <option value="OPERADOR">OPERADOR (Visualização)</option>
                  <option value="MOTORISTA">MOTORISTA (Edita próprios dados)</option>
                  <option value="ADMIN">ADMIN (Acesso total)</option>
                </select>
                <p class="mensagem-erro" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></p>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <a class="button button-secondary" th:href="@{/usuarios}">Cancelar</a>
            <button class="button button-primary" type="submit">Cadastrar Usuário</button>
          </div>
        </form>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
