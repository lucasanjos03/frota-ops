<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Usuários | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('usuarios')}"></header>

      <main class="page-container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Controle de acesso</p>
            <h1 th:text="${usuarioLogado.admin ? 'Usuários do Sistema' : 'Meu Perfil de Usuário'}">Usuários do Sistema</h1>
            <p class="page-subtitle">
              <span th:text="${totalUsuarios}">0</span>
              usuário(s) ativo(s) disponível(is) para o seu nível de permissão (<strong th:text="${usuarioLogado.perfil}"></strong>).
            </p>
          </div>
          <a class="button button-primary"
             th:if="${usuarioLogado.admin}"
             th:href="@{/usuarios/novo}">+ Novo usuário</a>
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <section class="content-section">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Perfil</th>
                  <th>Vínculo Motorista</th>
                  <th>Última Modificação</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                  <td colspan="7" class="empty-state">
                    Nenhum usuário ativo encontrado.
                  </td>
                </tr>
                <tr th:each="u : ${usuarios}">
                  <td><strong th:text="${u.username}"></strong></td>
                  <td th:text="${u.nome}"></td>
                  <td th:text="${u.email}"></td>
                  <td>
                    <span class="status-badge"
                          th:classappend="${u.perfil == 'ADMIN' ? 'status-info' : (u.perfil == 'MOTORISTA' ? 'status-success' : 'status-warning')}"
                          th:text="${u.perfil}"></span>
                  </td>
                  <td>
                    <span class="tag-badge"
                          th:if="${u.motorista != null}"
                          th:text="${'CNH ' + u.motorista.numeroCnh}"></span>
                    <span class="text-muted"
                          th:if="${u.motorista == null}">-</span>
                  </td>
                  <td th:text="${u.dataModificacao != null ? #temporals.format(u.dataModificacao, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                  <td class="cell-actions">
                    <div class="table-actions">
                      <a th:if="${usuarioLogado.podeEditarUsuario(u.id)}"
                         th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a>
                      <form th:if="${usuarioLogado.admin}"
                            th:action="@{/usuarios/excluir/{id}(id=${u.id})}"
                            method="post"
                            onsubmit="return confirm('Tem certeza que deseja excluir este usuário?');">
                        <button type="submit" class="btn-action-delete">Excluir</button>
                      </form>
                      <span class="text-muted"
                            th:if="${!usuarioLogado.podeEditarUsuario(u.id) and !usuarioLogado.admin}">Somente leitura</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
