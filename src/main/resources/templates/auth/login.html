<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Entrar | FleetOps')}"></th:block>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="login-brand">
          <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span><strong>Fleet</strong><b>Ops</b></span>
          </a>
          <h1>FleetOps</h1>
          <p class="page-subtitle">Gestão de Frota e Manutenção</p>
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <form method="post" th:action="@{/login}">
          <div class="form-group">
            <label for="username">E-mail ou usuário</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   placeholder="Ex.: admin ou carlos.silva"
                   th:value="${usernameTentativa != null ? usernameTentativa : (param.username != null ? param.username[0] : '')}"
                   required>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <label class="remember">
            <input type="checkbox" name="remember"
                   th:checked="${param.remember != null}"> Lembrar acesso
          </label>
          <p class="field-error" aria-live="polite" th:if="${param.error}">Usuário ou senha inválidos.</p>
          <button class="button button-primary" type="submit">Entrar no Sistema</button>
        </form>

        <p class="login-footnote">
          Não possui uma conta? <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>
      </section>
    </main>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
