<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head('Tags | FleetOps')}"></th:block>
  </head>
  <body>
    <div class="fleet-app">
      <header th:replace="~{fragments/layout :: appHeader('tags')}"></header>

      <main class="page-container">
        <div class="page-header">
          <div>
            <p class="eyebrow">Classificação da frota</p>
            <h1>Tags Operacionais</h1>
            <p class="page-subtitle">
              <span th:text="${totalTags}">0</span>
              tags cadastradas para classificação dos veículos.
            </p>
          </div>
          <a class="button button-primary"
             th:if="${usuarioLogado.podeGerenciarTags()}"
             th:href="@{/tags/novo}">+ Nova tag</a>
        </div>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <section class="content-section">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome da Tag</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(tags)}">
                  <td colspan="3" class="empty-state">
                    Nenhuma tag cadastrada.
                  </td>
                </tr>
                <tr th:each="tag : ${tags}">
                  <td th:text="${tag.id}"></td>
                  <td><span class="tag-badge" th:text="${tag.nome}"></span></td>
                  <td class="cell-actions">
                    <div class="table-actions">
                      <a th:if="${usuarioLogado.podeGerenciarTags()}"
                         th:href="@{/tags/editar/{id}(id=${tag.id})}">Editar</a>
                      <form th:if="${usuarioLogado.admin}"
                            th:action="@{/tags/excluir/{id}(id=${tag.id})}"
                            method="post"
                            onsubmit="return confirm('Tem certeza que deseja excluir esta tag?');">
                        <button type="submit" class="btn-action-delete">Excluir</button>
                      </form>
                      <span class="text-muted"
                            th:if="${!usuarioLogado.podeGerenciarTags() and !usuarioLogado.admin}">Somente leitura</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer th:replace="~{fragments/layout :: appFooter}"></footer>
    </div>
    <script th:src="@{/js/script.js}" defer></script>
  </body>
</html>
