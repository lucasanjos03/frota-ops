<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetOps - Ficha Técnica do Veículo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header>
    <h1><a href="index.html">FleetOps</a></h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="listagem.html">Veículos</a>
      <a href="cadastro.html">Novo Veículo</a>
    </nav>
  </header>

  <main>
    <h2 id="titulo-detalhes">Ficha Técnica</h2>

    <div class="card" id="card-detalhes" style="margin-bottom: 2rem;">
      <p>Carregando informações do veículo...</p>
    </div>

    <h3>Histórico de Manutenções</h3>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Tipo</th>
          <th>Descrição</th>
          <th>Custo (R$)</th>
        </tr>
      </thead>
      <tbody id="tabela-historico-corpo">
        <!-- Renderizado dinamicamente via JavaScript -->
      </tbody>
    </table>

    <a id="btn-nova-manutencao" href="edicao.html" class="btn" style="text-decoration: none; display: inline-block;">Registrar Nova Manutenção</a>
  </main>

</body>
</html>
