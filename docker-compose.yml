# =============================================================================
# FleetOps — stack local para validar a imagem antes do deploy.
# Sobe um PostgreSQL 16 + a aplicação empacotada (mesma imagem usada no Render).
#
#   docker compose up --build
#   Acesse: http://localhost:8081
#
# Obs.: o Flyway cria o schema (V1..V5) automaticamente no primeiro boot.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: frota-ops-deploy-db
    environment:
      POSTGRES_DB: frota-ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # host 55433 -> container 5432 (evita conflito com os bancos locais já em uso)
      - "55433:5432"
    volumes:
      - frota_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frota-ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frota-ops-deploy-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/frota-ops
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  frota_ops_pgdata:
