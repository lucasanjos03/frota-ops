<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar veículo | FleetOps</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" href="css/styles.css">
</head>
<body>
  <div class="fleet-app">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" th:href="@{/}" href="index.html">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Fleet</strong><b>Ops</b></span>
        </a>
        <nav class="nav-menu" aria-label="Navegação principal">
          <a class="nav-item" th:href="@{/}" href="index.html">Dashboard</a>
          <a class="nav-item active" th:href="@{/veiculos}" href="veiculos.html">Veículos</a>
          <a class="nav-item" th:href="@{/veiculos/novo}" href="veiculo-novo.html">Novo veículo</a>
          <a class="nav-item nav-logout" th:href="@{/login}" href="login.html">Sair</a>
        </nav>
      </div>
    </header>
    <main class="page-container">
      <div class="page-header">
        <div>
          <p class="eyebrow">Cadastro de veículo</p>
          <h1>Editar Veículo</h1>
          <p class="page-subtitle">Atualize os dados cadastrais e de manutenção.</p>
        </div>
      </div>
      <form class="form-card" method="post" th:action="@{/veiculos/{id}/editar(id=1)}">
        <div class="form-section">
          <div class="form-section-heading"><h2>Dados do veículo</h2></div>
          <div class="form-grid">
            <div class="form-group"><label for="plate">Placa *</label><input id="plate" name="placa" value="ABC1D23" required></div>
            <div class="form-group"><label for="model">Modelo *</label><input id="model" name="modelo" value="Ford Transit 350" required></div>
            <div class="form-group"><label for="year">Ano *</label><input id="year" name="ano" type="number" value="2023" required></div>
            <div class="form-group"><label for="mileage">Quilometragem *</label><input id="mileage" name="quilometragem" type="number" value="42180" required></div>
            <div class="form-group">
              <label for="status">Status *</label>
              <select id="status" name="status">
                <option selected>Disponível</option>
                <option>Em trânsito</option>
                <option>Em manutenção</option>
                <option>Indisponível</option>
              </select>
            </div>
            <div class="form-group"><label for="last-review">Data da última revisão</label><input id="last-review" name="ultimaRevisao" type="date" value="2026-06-18"></div>
            <div class="form-group"><label for="next-review">Data da próxima revisão</label><input id="next-review" name="proximaRevisao" type="date" value="2026-09-18"></div>
            <div class="form-group form-group-full">
              <label for="notes">Observações</label>
              <textarea id="notes" name="observacoes" rows="4">Veículo utilizado em rotas urbanas e regionais. Pneus revisados na última manutenção preventiva.</textarea>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a class="button button-secondary" th:href="@{/veiculos/{id}(id=1)}" href="veiculo-detalhes.html">Cancelar</a>
          <button class="button button-primary" type="submit">Salvar Alterações</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
