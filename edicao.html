<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetOps - Registro de Manutenção</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header>
    <h1><a href="index.html">FleetOps</a></h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="listagem.html">Veículos</a>
      <a href="cadastro.html">Novo Veículo</a>
    </nav>
  </header>

  <main>
    <h2>Registrar Ordem de Serviço / Manutenção</h2>

    <div id="mensagem-sucesso" class="mensagem-sucesso" style="display: none;"></div>

    <form id="form-edicao-manutencao" novalidate>
      <div class="form-group" id="grupo-veiculo-texto">
        <label for="veiculo">Veículo Selecionado</label>
        <input type="text" id="veiculo" value="Carregando..." disabled>
        <input type="hidden" id="veiculo-id">
      </div>

      <div class="form-group" id="grupo-veiculo-select" style="display: none;">
        <label for="veiculo-dropdown">Selecione o Veículo *</label>
        <select id="veiculo-dropdown" name="veiculo-dropdown">
          <option value="">Selecione um veículo...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Serviço</label>
        <select id="tipo" name="tipo">
          <option value="Preventiva">Preventiva</option>
          <option value="Corretiva">Corretiva</option>
          <option value="Urgência">Urgência</option>
        </select>
      </div>

      <div class="form-group">
        <label for="custo">Custo do Serviço (R$) *</label>
        <input type="text" id="custo" name="custo" required placeholder="Ex: R$ 850,00">
      </div>

      <div class="form-group">
        <label for="descricao-manutencao">Descrição do Problema / Laudo *</label>
        <textarea id="descricao-manutencao" name="descricao" rows="4" maxlength="200" required placeholder="Descreva os serviços a serem realizados..."></textarea>
        <div id="contador-caracteres" class="contador-container">0/200 caracteres</div>
      </div>

      <div class="form-group">
        <label for="novo-status">Atualizar Status do Veículo</label>
        <select id="novo-status" name="novo-status">
          <option value="manutencao" selected>Em Manutenção</option>
          <option value="disponivel">Disponível (Baixa no Chamado)</option>
          <option value="transito">Em Trânsito</option>
        </select>
      </div>

      <button type="submit" class="btn">Salvar Alterações</button>
    </form>
  </main>

</body>
</html>
