<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetOps - Dashboard de Gestão de Frota</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header>
    <h1><a href="index.html">FleetOps</a></h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="listagem.html">Veículos</a>
      <a href="cadastro.html">Novo Veículo</a>
    </nav>
  </header>

  <main>
    <h2>Visão Geral da Frota</h2>

    <section class="cards-grid">
      <div class="card">
        <h3>Total de Veículos</h3>
        <p class="numero" id="total-veiculos">0</p>
      </div>
      <div class="card">
        <h3>Em Trânsito</h3>
        <p class="numero" id="total-transito">0</p>
      </div>
      <div class="card">
        <h3>Em Manutenção</h3>
        <p class="numero" id="total-manutencao">0</p>
      </div>
      <div class="card">
        <h3>Disponíveis</h3>
        <p class="numero" id="total-disponiveis">0</p>
      </div>
    </section>

    <h3>Alertas de Manutenção Perto do Prazo</h3>
    <table>
      <thead>
        <tr>
          <th>Placa</th>
          <th>Modelo</th>
          <th>Última Revisão</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-alertas-corpo">
        <!-- Renderizado dinamicamente via JavaScript -->
      </tbody>
    </table>
  </main>

</body>
</html>
